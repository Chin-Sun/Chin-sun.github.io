- category: Embedded Systems
  slug: embed
  description: Hardware + Microcontroller + PCB based systems
  projects:
    - title: Balancing Robot Car
      description: I built a little two-wheel car that doesn't fall over! It uses something called PID — kind of like a tiny brain — to keep itself upright. Even if it leans, it adjusts quickly to stay balanced. It’s like a toy that learned yoga!
      tech: [Arduino, "C++", PID]
      image: /img/portfilio/car.PNG
      github: https://github.com/Chin-Sun/My_Balancing_Car_System_based_on_Arduino
      demo: https://www.youtube.com/watch?v=kOZWG59ebCE&feature=youtu.be
    - title: Smart Plant Watering System
      description: This system waters plants all by itself. I built the circuit and wrote the code so a small computer could decide when to turn the water on. It checks how dry the soil is and shows everything on a computer screen. No more forgetting to water plants!
      tech: [Kingview, C, Altium Designer]
      image: /img/portfilio/smart.png
      github: https://github.com/Chin-Sun/Smart_Greenhouse_Irrigation_System
      demo: https://www.youtube.com/watch?v=n6UJMdB_ueU&feature=youtu.be
    - title: Spinning LED Clock
      description: I made a spinning device with lights that can show the time and temperature — like magic floating text! I designed the electronic board and programmed it to blink in just the right way as it spins. It’s like building a tiny light show that tells you the time.
      tech: [Keil uVision, "C++", Altium Designer]
      image: /img/portfilio/light.png
      github: https://github.com/Chin-Sun/Rotating_LED_electronic_light
      demo: https://www.youtube.com/watch?v=um-tjEZWeqE&feature=youtu.be
