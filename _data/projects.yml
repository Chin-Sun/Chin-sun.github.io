      demo: https://www.youtube.com/watch?v=3dOk_ofCyZ0&feature=youtu.be
    - title: AI Video Helper
      description: This project was built by a team of three in just 12 hours! It's like a smart robot that watches videos and helps people by Writing subtitles automatically, Summarizing what people said, and Translating what’s spoken into other languages, which all in real time! 
      tech: [Streamlit, Flash, OpenCV, HuggingFace, Whisper, DeepTranslator]
      image: /img/portfilio/ai.png
      github: https://github.com/Chin-Sun/AI-based_Real-time_Translation
      demo: https://drive.google.com/file/d/15HyKCIQCapjHQqBC5Ib1zLj0PZ-PJWSs/view?usp=sharing
    - title: Job Matching Website
      description: This is a website where people who need help (like fixing something or designing something) can find others who know how to do it. People can sign up, show their skills, and the website will match them with someone who needs that help. It's like a super smart job-finding assistant!  
      tech: [Django, HTML, CSS, JavaScript, SQLite, OAuth 2.0, Heroku]
      image: /img/portfilio/freelancer.PNG
      github: https://github.com/Chin-Sun/Freelancer-Platform
    - title: Library Room Booking Tool
      description: We made a website for students to book study rooms at school. They choose their class and textbook, and the system checks which rooms are free. If rooms are full, it helps create a new one. Teachers can also see who’s studying together. No double-booking allowed!   
      tech: [Django, HTML, CSS, JavaScript, PostgreSQL, OAuth 2.0]
      image: /img/portfilio/reserve.PNG
      github: https://github.com/Chin-Sun/Reserve-Reading-Room
      
