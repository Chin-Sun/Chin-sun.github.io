---
layout: default
title: Portfolio
permalink: /portfolio/
---

<section class="portfolio-home">
  <h1>My Portfolio</h1>
  <div class="category-grid">
    {% for group in site.data.projects %}
    <a href="/portfolio/{{ group.slug }}/" class="category-card">
      <div class="category-index">0{{ forloop.index }}</div>
      <h2>{{ group.category }}</h2>
      <p>{{ group.description }}</p>
      <div class="category-arrow">→</div>
    </a>
    {% endfor %}
  </div>
</section>
