
---
layout: default
title: P
permalink: /portfoliozh/
---

<section class="portfolio-grid">
  {% for group in site.data.projectsZH %}
  <a href="/portfoliozh/{{ group.slug }}/" class="portfolio-card">
    <div class="card-number">0{{ forloop.index }}</div>
    <div class="card-content">
      <h2>{{ group.category }}</h2>
      <p>{{ group.description }}</p>
    </div>
    <div class="card-arrow">&rarr;</div>
  </a>
  {% endfor %}
</section>

<style>
body {
  background-color: #fffffc;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
               Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
}

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 2rem;
  padding: 4rem 2rem;
  max-width: 1200px;
  margin: auto;
}

.portfolio-card {
  background: #5e6472;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 2rem;
  text-decoration: none;
  color: white;
  position: relative;
  transition: all 0.3s ease;
}

.portfolio-card:hover {
  background-color: #222;
  transform: translateY(-4px);
  box-shadow: 0 8px 16px rgba(0, 255, 170, 0.1);
}

.card-number {
  font-size: 2rem;
  font-weight: bold;
  color: #00ffcc;
  margin-bottom: 1rem;
}

.card-content h2 {
  font-size: 1.5rem;
  font-weight: 700; /* 加粗 */
  margin-bottom: 0.5rem;
  color: white; /* 确保标题也是白色 */
}

.card-content p {
  font-size: 0.95rem;
  color: white;
}

.card-arrow {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  background-color: white;
  color: black;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: transform 0.3s ease;
}

.portfolio-card:hover .card-arrow {
  transform: translateX(4px);
}
</style>
